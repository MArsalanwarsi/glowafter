name: Publish to npm

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript package
        run: npm run build
      - name: Run test suite (1,621 tests)
        run: npm test
      - name: Run code linter
        run: npm run lint

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [checks]
    runs-on: ubuntu-24.04
    concurrency:
      group: npm-release-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Bump patch, push release tag and publish the tarball
        id: publish
        run: bash scripts/release.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify public install
        if: steps.publish.outputs.version != ''
        timeout-minutes: 9
        env:
          RELEASE_VERSION: ${{ steps.publish.outputs.version }}
        run: bash scripts/verify-public-install.sh "$RELEASE_VERSION"

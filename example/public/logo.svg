<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="128" height="128" rx="28" fill="#0b0f17" />
  <rect width="126" height="126" x="1" y="1" rx="27" stroke="url(#circleGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="64" cy="64" r="44" fill="url(#bgGlow)" filter="url(#softGlow)" />

  <!-- Outer Orbit Waves / Sweep -->
  <circle cx="64" cy="64" r="38" stroke="url(#circleGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <path d="M 64 20 A 44 44 0 0 1 108 64" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <path d="M 64 108 A 44 44 0 0 1 20 64" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- Theme Transition Core: Half Sun / Half Moon Wave -->
  <!-- Left Side: Sunburst / Daylight Wave -->
  <path d="M 64 28 A 36 36 0 0 0 64 100 Q 56 64 64 28 Z" fill="url(#sunGrad)" opacity="0.9" />
  <!-- Sun Rays -->
  <line x1="38" y1="64" x2="44" y2="64" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="45" y1="45" x2="50" y2="50" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="45" y1="83" x2="50" y2="78" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Right Side: Crescent Nocturnal Veil -->
  <path d="M 64 28 A 36 36 0 0 1 64 100 Q 56 64 64 28 Z" fill="url(#moonGrad)" />
  <circle cx="76" cy="54" r="2" fill="#38bdf8" />
  <circle cx="84" cy="68" r="1.5" fill="#a855f7" />
  <circle cx="74" cy="78" r="2" fill="#34d399" />

  <!-- Center Energy Suture Wave -->
  <path d="M 64 26 C 54 48 74 80 64 102" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
</svg>
